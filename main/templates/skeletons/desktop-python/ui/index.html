<!DOCTYPE html>
<!-- webui 应用外壳（批8 骨架 v2）——布局/桥接/状态条已接线；业务视图在 <main class="w-content"> 内扩展。
     样式只改 ui/kit.css（tokens 在 ui/tokens.css）；组件用法见 ui/PATTERNS.md。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{project_title}}</title>
  <link rel="stylesheet" href="kit.css">
</head>
<body>
<div class="w-app">

  <aside class="w-side">
    <div class="w-side-title">{{project_title}}</div>
    <!-- 列表区：App.renderList 填充（空态自动呈现引导） -->
    <div id="side-list"></div>
    <div style="margin-top:auto; padding: var(--s3);">
      <button class="w-btn w-btn--ghost" id="btn-new" data-bloma-id="side.new" style="width:100%">＋ 新建</button>
    </div>
  </aside>

  <main class="w-main">
    <div class="w-topbar">
      <div>
        <div class="w-topbar-title" id="topbar-title" data-bloma-id="topbar.title">…</div>
        <div class="w-topbar-sub" id="topbar-sub" data-bloma-id="topbar.sub"></div>
      </div>
    </div>

    <!-- 状态反馈条：App.show("running"|"success"|"partial"|"failed", 文案, 下一步) -->
    <div style="padding-top: var(--s3);"></div>
    <div class="w-banner"></div>

    <div class="w-content" id="content">
      <!-- 业务视图区：卡片/列表/气泡/表单按 PATTERNS.md 组装 -->
      <div class="w-card">
        <div class="w-card-title">就绪</div>
        <div style="color: var(--text-sub)">骨架已接线——把你的业务视图写在这里。</div>
      </div>
    </div>

    <!-- 输入区（按需启用；非输入型应用可整块删除） -->
    <div class="w-input-row" id="input-row">
      <input class="w-input" id="main-input" data-bloma-id="input.main" placeholder="输入…（Enter 发送）">
      <button class="w-btn w-btn--primary" id="btn-send" data-bloma-id="action.send">发送</button>
    </div>
  </main>

</div>
<script src="bridge.js"></script>
<script src="correction.js"></script>
<script>
  // ── 桥就绪后的首屏装载（数据从 Python 逻辑层来；UI 不自持真相） ──
  async function refresh() {
    try {
      var items = await App.call("list_items");
      App.renderList(document.getElementById("side-list"), items, {
        idKey: "id", name: "name", sub: "sub",
        emptyTitle: "还没有条目", emptyHint: "点左下角「新建」创建第一个",
      });
    } catch (e) {
      App.show("failed", "加载失败：" + e.message, "请重启应用后重试");
    }
  }
  window.addEventListener("pywebviewready", refresh);
  document.getElementById("btn-new").addEventListener("click", function () { /* 接新建流程 */ });
  document.getElementById("btn-send").addEventListener("click", onSend);
  document.getElementById("main-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); onSend(); }
  });
  async function onSend() {
    var input = document.getElementById("main-input");
    var text = input.value.trim();
    if (!text) return;
    try {
      App.show("running", "处理中…");
      input.value = "";
      var result = await App.call("handle_send", text);
      App.show("success", result.message || "完成");
      await refresh();
    } catch (e) {
      App.show("failed", "操作失败：" + e.message, "输入内容已保留，可重试");
      input.value = text; // 失败不丢已输入内容（UX 契约 failed 态）
    } finally {
      setTimeout(App.hide, 2600);
    }
  }
</script>
<script src="preview-state.js"></script>
</body>
</html>
