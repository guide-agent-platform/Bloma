<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>资料与同步工作台</title><link rel="stylesheet" href="product_settings.css"><link rel="stylesheet" href="product_workbench.css"></head><body>
<header><div><h1>资料与同步工作台</h1><p>保留来源，整理结果，明确每次同步。</p></div><button id="toggle-settings">AI 服务设置</button></header>
<section id="settings" hidden></section><p id="resource-status" role="status"></p>
<main id="workspace"><section class="card"><div class="actions"><select id="file-kind" aria-label="导入类型"><option value="document">文档资料</option><option value="image">图片</option><option value="audio">音频 WAV</option></select><button id="import">导入文件</button><button id="parse">预览文档解析</button><button id="commit">提交所选预览</button><button id="export">导出备份</button><button id="restore">恢复备份</button></div>
<div class="actions filters"><input id="query" aria-label="搜索资料" placeholder="搜索资料、结果或记录"><select id="type" aria-label="资料类型"><option value="">全部</option><option value="asset">来源文件</option><option value="document">文档内容</option><option value="analysis">分析结果</option><option value="remote">外部记录</option><option value="import_preview">导入预览</option><option value="outbound">同步记录</option></select><select id="sort" aria-label="排序"><option value="name">名称</option><option value="revision">修订</option><option value="id">标识</option></select><button id="delete">删除选中</button></div>
<p id="count" role="status"></p><div class="table-wrap"><table><thead><tr><th>选择</th><th>名称 / 来源</th><th>类型</th><th>修订</th></tr></thead><tbody id="records"></tbody></table></div><div class="actions"><button id="prev">上一页</button><span id="pages"></span><button id="next">下一页</button></div></section>
<section class="card detail"><h2>来源与处理结果</h2><p id="source">选择一份资料查看详情</p><img id="preview-image" hidden alt="当前来源图片"><pre id="record-detail"></pre><label>处理方式<select id="mode"><option value="vision">AI 图片理解</option><option value="ocr">本机文字识别</option><option value="audio">音频转写</option></select></label><label>处理说明<input id="prompt" value="描述图片中的内容"></label><label>OCR 语言<input id="language" value="zh-Hans-CN"></label><label class="consent"><input type="checkbox" id="ai-consent">我同意向已配置 AI 服务发送所选图片，可能产生费用。</label><button id="analyze">处理所选来源</button><label>结果 / 人工校正<textarea id="correction" rows="5"></textarea></label><button id="correct">保存校正</button></section>
<section class="card"><h2>连接与同步</h2><label>当前连接<select id="connection"></select></label><div class="actions"><button id="pull">拉取记录</button><button id="webhook">开启本机通知接收</button></div><p id="webhook-url"></p><label class="consent"><input type="checkbox" id="sync-consent">我同意把所选分析结果写入当前连接。</label><button id="sync">同步所选结果</button><details><summary>编辑连接设置</summary><form id="connection-form"><label>名称<input name="name" value="我的连接"></label><label>API 基地址<input name="baseUrl" type="url" required></label><label>网络<select name="network"><option value="public">HTTPS 公网</option><option value="loopback">仅本机</option></select></label><label>读取路径<input name="readPath" value="items"></label><label>写入路径<input name="writePath" value="items"></label><label>写入方法<select name="writeMethod"><option>POST</option><option>PUT</option><option>PATCH</option></select></label><label>字段与分页映射（JSON）<textarea name="mappingConfig" rows="5">{"itemsPath":"items","nextPath":"next","checkpointPath":"checkpoint","cursorParam":"cursor","idPath":"id","versionPath":"version","mapping":{"title":"title"}}</textarea></label><label>API Key<input name="key" type="password" autocomplete="new-password" placeholder="留空保留已有 Key"></label><label>通知签名密钥<input name="webhookKey" type="password" autocomplete="new-password" placeholder="留空保留已有密钥"></label><p>凭据仅存于本产品系统加密存储，界面不可回读。</p><div class="actions"><button type="submit">保存连接</button><button type="button" id="connection-reset">取消修改 / 重新载入</button></div></form></details>
<details><summary>核对未知写入</summary><label>同步记录 ID<input id="reconcile-id"></label><label>核对结果<select id="reconcile-state"><option value="done">确认已写入</option><option value="not_applied">确认未写入</option></select></label><label>核对依据 / 远端记录 ID<input id="remote-id"></label><button id="reconcile">记录核对结果</button></details></section>
<section class="card"><h2>处理任务</h2><div id="jobs"></div><h3>批量操作结果</h3><pre id="batch-results"></pre></section></main><output id="notice" role="status" aria-live="polite">正在载入…</output><script src="product_settings_ui.js"></script><script src="product_workbench_ui.js"></script></body></html>
