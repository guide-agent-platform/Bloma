<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>点选纠错弹窗</title>
  <style>
    :root {
      --bg: #f5f6f3;
      --panel: #fff;
      --ink: #202421;
      --muted: #66706a;
      --line: #d8ded8;
      --accent: #087f72;
      --danger: #c2412d;
      --highlight: rgba(8, 127, 114, .16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .frame {
      width: min(1080px, 100%);
      height: min(680px, calc(100vh - 48px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      grid-template-columns: 34% 1fr;
      overflow: hidden;
      position: relative;
    }
    .chat {
      border-right: 1px solid var(--line);
      padding: 18px;
      display: grid;
      align-content: start;
      gap: 12px;
      background: #fbfbfa;
    }
    .msg { padding: 12px 13px; border-radius: 8px; line-height: 1.55; font-size: 14px; background: #eef3ef; }
    .preview {
      padding: 22px;
      position: relative;
      background: #fff;
    }
    .app {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      height: 100%;
    }
    h1 { margin: 0 0 18px; font-size: 26px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 16px; }
    input { border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 14px; }
    button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 0 12px; }
    .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .list { display: grid; gap: 10px; }
    .item { border: 1px solid var(--line); border-radius: 7px; padding: 12px; display: flex; justify-content: space-between; }
    .target {
      position: relative;
      outline: 3px solid var(--accent);
      background: var(--highlight);
    }
    .callout {
      position: absolute;
      top: 164px;
      right: 70px;
      width: 320px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 20px 48px rgba(22, 30, 26, .18);
      padding: 14px;
      z-index: 3;
    }
    .callout:before {
      content: "";
      position: absolute;
      top: -9px;
      left: 26px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-left: 1px solid var(--line);
      border-top: 1px solid var(--line);
      transform: rotate(45deg);
    }
    .callout h2 { margin: 0 0 8px; font-size: 15px; }
    textarea {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
      line-height: 1.45;
    }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .context { margin-top: 8px; font-size: 12px; color: var(--muted); }
    @media (max-width: 760px) {
      .frame { height: auto; min-height: calc(100vh - 48px); grid-template-columns: 1fr; }
      .chat { display: none; }
      .callout { position: fixed; left: 16px; right: 16px; top: auto; bottom: 16px; width: auto; }
    }
  </style>
</head>
<body>
  <div class="frame" data-ai-id="point-correction-state">
    <aside class="chat" data-ai-id="chat-panel">
      <div class="msg">你可以直接点预览里不满意的地方，我会根据位置和你的说明来改。</div>
      <div class="msg">刚才你点了金额显示区域。</div>
    </aside>
    <main class="preview" data-ai-id="preview-panel">
      <div class="app" data-ai-id="generated-app-preview">
        <h1>记账列表</h1>
        <div class="row">
          <input value="午餐 28 元">
          <button class="primary">保存</button>
        </div>
        <div class="list">
          <div class="item"><span>午餐</span><strong>¥28</strong></div>
          <div class="item target" data-ai-id="selected-preview-element"><span>地铁</span><strong>6</strong></div>
          <div class="item"><span>咖啡</span><strong>¥18</strong></div>
        </div>
      </div>
      <section class="callout" data-ai-id="point-correction-popover" role="dialog" aria-modal="true" aria-labelledby="correction-title">
        <h2 id="correction-title">这里有什么问题？</h2>
        <textarea data-ai-id="correction-input" placeholder="比如：金额前面也要显示 ¥，或者这里颜色太浅"></textarea>
        <div class="context" data-ai-id="correction-context">已记录点击位置和当前页面状态。</div>
        <div class="actions">
          <button data-ai-id="correction-close">你猜</button>
          <button class="primary" data-ai-id="correction-submit">提交</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
